[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorylab"
version = "1.0.0"
description = "A deterministic benchmark harness for synthetic agent memory policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memorylab = "memorylab.cli:main"

[tool.setuptools.packages.find]
include = ["memorylab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
